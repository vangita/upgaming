# Runs the unit tests on every push and pull request. They need no network, Qdrant or LLM key.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ui/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
